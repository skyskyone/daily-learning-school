<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>打坐評核｜每日學堂</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="paper-bg meditation-page">
  <main class="page-shell compact-shell">
    <header class="student-header">
      <div>
        <p class="eyebrow">每日學堂</p>
        <h1>打坐評核</h1>
      </div>
      <div class="header-actions">
        <a href="index.html">返回今日題目</a>
        <a href="reflections.html">心得區</a>
        <a href="student-history.html">作答簿</a>
        <a href="lessons.html">教學影片</a>
        <button id="meditation-logout" class="text-btn">離開學堂</button>
      </div>
    </header>

    <div id="meditation-auth" class="notice hidden"></div>
    <div id="meditation-notice" class="notice hidden"></div>

    <section class="meditation-layout">
      <aside class="panel meditation-history-panel">
        <p class="eyebrow">Monthly Archive</p>
        <h2>歷史紀錄</h2>
        <p class="muted">選擇月份，查看該月每週評核及師父評語。</p>
        <nav id="meditation-month-list" class="meditation-month-list" aria-label="評核歷史月份"></nav>
      </aside>

      <section class="panel meditation-main-panel">
        <div class="section-heading">
          <div>
            <p class="eyebrow">Weekly Review</p>
            <h2 id="meditation-current-month">本月評核</h2>
          </div>
        </div>
        <p class="meditation-review-intro">每週由師父檢視打坐情況。評核只供本人查看，請細閱師父的鼓勵與提醒。</p>
        <div id="meditation-review-list" class="meditation-review-list">
          <div class="empty-state">正在載入評核紀錄……</div>
        </div>
      </section>
    </section>

    <section class="ancestor-quote-panel meditation-ancestor-panel">
      <div class="ancestor-seal">訓</div>
      <div class="ancestor-heading">皇明祖訓</div>
      <div id="ancestor-quote" class="ancestor-quote" aria-live="polite"></div>
    </section>
  </main>
  <script src="config.js"></script>
  <script src="api.js"></script>
  <script src="world-tree.js"></script>
</body>
</html>
